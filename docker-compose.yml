version: '3.8'

services:
  # Local AI Tutor FastAPI Backend & Frontend UI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local_ai_tutor_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
    volumes:
      - ./vector_store:/app/vector_store
      - ./documents:/app/documents
    depends_on:
      - ollama
    restart: unless-stopped

  # Local LLM Runner (Ollama with LLaMA3:8B)
  ollama:
    image: ollama/ollama:latest
    container_name: local_ai_tutor_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
